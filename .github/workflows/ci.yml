name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python and validate hook JSON
        run: >-
          python -c "import json, pathlib, py_compile; py_compile.compile('install.py', doraise=True); py_compile.compile('scripts/brain.py', doraise=True); [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('hooks').rglob('*.json')]; print('static checks passed')"
      - name: Run native smoke suite
        shell: python
        run: |
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "tests/smoke_test.py"],
              text=True,
              capture_output=True,
          )
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          if result.returncode:
              detail = (result.stdout + result.stderr).replace("%", "%25")
              detail = detail.replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Native smoke suite failed::{detail}")
              raise SystemExit(result.returncode)
      - name: Run POSIX shell smoke suite
        if: runner.os != 'Windows'
        run: bash tests/smoke_test.sh
